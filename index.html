<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            margin-top: 10px;
            padding: 10px 24px;
            background: #4A90E2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #357ABD; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        #result {
            margin-top: 20px;
            padding: 16px;
            background: white;
            border-radius: 6px;
            border: 1px solid #ddd;
            display: none;
        }
        #error { color: red; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <h1>Text Summarizer</h1>
    <textarea id="inputText" placeholder="Paste your text here..."></textarea>
    <br>
    <button id="submitBtn" onclick="summarize()">Summarize</button>
    <p id="error"></p>
    <div id="result">
        <h3>Summary:</h3>
        <p id="summaryText"></p>
    </div>

    <script>
        const API_URL = "https://generative-ai-application-with-langchain.onrender.com/summarize";

        async function summarize() {
            const text = document.getElementById("inputText").value.trim();
            const btn = document.getElementById("submitBtn");
            const error = document.getElementById("error");
            const result = document.getElementById("result");

            if (!text) {
                showError("Please enter some text to summarize.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Summarizing...";
            error.style.display = "none";
            result.style.display = "none";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) throw new Error("Server error: " + response.status);

                const data = await response.json();
                document.getElementById("summaryText").textContent = data.message;
                result.style.display = "block";
            } catch (err) {
                showError("Failed to connect to the API. Make sure your backend is running.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Summarize";
            }
        }

        function showError(msg) {
            const error = document.getElementById("error");
            error.textContent = msg;
            error.style.display = "block";
        }
    </script>
</body>
</html>
